line-length = 88
indent-width = 4
target-version = "py311"  # keep in sync with requires-python in pyproject.toml

[lint]
select = [  # https://docs.astral.sh/ruff/rules/
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90",  # mccabe complexity
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "ICN",  # flake8-import-conventions
    "NPY",  # NumPy-specific rules
    "PT",  # flake8-pytest-style
    "TID",  # flake8-tidy-imports
    "ERA",  # eradicate
    "PL",  # Pylint
    "PERF",  # Perflint
    "FURB",  # refurb
    "RUF",  # Ruff-specific rules
    "D",  # pydocstyle
    "ANN",  # flake8-annotations
]
ignore = [
    "D105",  # docstring in magic method
    "D107",  # docstring in __init__
    "D205",  # blank line after docstring summary
    "ANN401",  # typing.Any
    "PLR2004",  # magic value comparison
    "PLC0415",  # import outside top level (lazy imports of optional deps)
    "TID252",  # relative imports
    "PTH118",  # os.path.join
    "PTH123",  # builtin open()
    "RUF001",  # ambiguous unicode in strings (×, σ, – are intended)
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "PLW2901",  # loop variable reassigned (x = x.to(device) is intended)
]

[lint.pylint]
max-args = 10

[lint.per-file-ignores]
"{tests,scripts,data}/**" = ["D1", "ANN"]
"*.ipynb" = ["D1", "ANN", "E402", "I001"]
# Adapted third-party code (pycocotools): keep it close to upstream.
"src/patch_where_objects_are/evaluators/adapted_pycocotools/cocoeval.py" = ["ALL"]

[lint.pydocstyle]
convention = "google"

[format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
